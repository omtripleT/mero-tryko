<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--red:#D62828;--gold:#F4B400;--cream:#FFF8E7;--orange:#FF7A18;--green:#3A7D44}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background-color:var(--cream);min-height:100vh}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
.card{background:#fff;width:100%;max-width:420px;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(214,40,40,.10),0 4px 16px rgba(0,0,0,.07);transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 28px 72px rgba(214,40,40,.16),0 8px 24px rgba(0,0,0,.10);transform:translateY(-3px)}
.card-header{background:linear-gradient(to bottom right,#FFD54F,#FF9800,#FF3D00,#D50000);padding:2rem 2rem 1.8rem;text-align:center;position:relative}
.card-header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:22px;background:#fff;border-radius:20px 20px 0 0}
.logo-circle{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.18);border:2.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:28px;color:#fff}
.card-header h2{color:#fff;font-size:1.5rem;font-weight:700;letter-spacing:.4px}
.card-header p{color:rgba(255,255,255,.78);font-size:.85rem;margin:.3rem 0 0}
.card-body{padding:1.8rem 1.8rem 1.6rem}
.form{display:flex;flex-direction:column;gap:.9rem}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;padding:.9rem 1rem .9rem 2.8rem;font-size:1rem;font-family:inherit;border:1.5px solid #e8e0d0;border-radius:12px;background:var(--cream);color:#1a1a1a;outline:none;appearance:none;transition:border-color .25s,box-shadow .25s,background .25s}
.input-wrap input:hover{border-color:#d4b800;background:#fffef5}
.input-wrap input:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3.5px rgba(244,180,0,.18)}
.input-wrap input::placeholder{color:#bbb}
.icon-left{position:absolute;left:14px;font-size:18px;color:#ccc;pointer-events:none;z-index:1;transition:color .2s}
.input-wrap input:hover~.icon-left,.input-wrap input:focus~.icon-left{color:var(--gold)}
.btn{width:100%;min-height:52px;padding:1rem;background:linear-gradient(to bottom right,#FFD54F,#FF9800,#FF3D00,#D50000);color:#fff;font-size:1rem;font-weight:700;font-family:inherit;letter-spacing:.6px;border:none;border-radius:12px;cursor:pointer;margin-top:.3rem;transition:opacity .25s,transform .15s,box-shadow .25s}
.btn:hover{opacity:.88;box-shadow:0 6px 20px rgba(214,40,40,.35);transform:translateY(-1px)}
.btn:active{transform:scale(.98);box-shadow:none}
.divider{display:flex;align-items:center;gap:.8rem;margin:1.1rem 0 .7rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#f0e8d8}
.divider span{font-size:.78rem;color:#bbb;font-weight:500;white-space:nowrap}
.links{display:flex;justify-content:center;gap:1.5rem}
.links a{font-size:.9rem;color:var(--green);text-decoration:none;font-weight:600;padding:.45rem .8rem;border-radius:8px;display:inline-flex;align-items:center;gap:5px;transition:background .2s,color .2s,transform .15s}
.links a:hover{background:#edf7ef;color:#2a5c31;transform:translateY(-1px)}
.links a i{font-size:15px}
@media(max-width:480px){
.page{align-items:flex-start;padding:0}
.card{border-radius:0 0 24px 24px;max-width:100%;box-shadow:0 8px 30px rgba(214,40,40,.12)}
.card:hover{transform:none}
.card-body{padding:1.5rem 1.2rem 1.8rem}
}
</style>
</head>
<body>
<div class="page">
<div class="card">
<div class="card-header">
<div class="logo-circle"><i class="ti ti-lock"></i></div>
<h2>Welcome Back</h2>
<p>Login to your account</p>
</div>
<div class="card-body">
<form class="form" onsubmit="return false;">
<div class="input-wrap">
<input type="email" name="email" placeholder="Email Address" required>
<i class="ti ti-mail icon-left"></i>
</div>
<div class="input-wrap">
<input type="password" name="password" placeholder="Password" required>
<i class="ti ti-lock icon-left"></i>
</div>
<button type="submit" class="btn">Login</button>
</form>
<div class="divider"><span>don't have an account?</span></div>
<div class="links">
<a href="register.html"><i class="ti ti-user-plus"></i> Register</a>
<a href="index.html"><i class="ti ti-home"></i> Home</a>
</div>
</div>
</div>
</div>
</body>
</html>
