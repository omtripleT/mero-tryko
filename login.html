<html lang="en">
<head>

  <style>
    :root {
  --red:    #D62828;
  --gold:   #F4B400;
  --cream:  #FFF8E7;
  --orange: #FF7A18;
  --green:  #3A7D44;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: var(--cream);
  min-height: 100vh;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 1rem;
}

.card {
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 20px 60px rgba(214, 40, 40, 0.10),
    0 4px 16px rgba(0, 0, 0, 0.07);
  transition: box-shadow 0.3s, transform 0.3s;
}

.card:hover {
  box-shadow:
    0 28px 72px rgba(214, 40, 40, 0.16),
    0 8px 24px rgba(0, 0, 0, 0.10);
  transform: translateY(-3px);
}

.card-header {
  background: linear-gradient(
    to bottom right,
    #FFD54F,
    #FF9800,
    #FF3D00,
    #D50000
  );
  padding: 2rem 2rem 1.8rem;
  text-align: center;
  position: relative;
}

.card-header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 22px;
  background: #ffffff;
  border-radius: 20px 20px 0 0;
}

.logo-circle {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  border: 2.5px solid rgba(255, 255, 255, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  font-size: 28px;
  color: #fff;
}

.card-header h2 {
  color: #ffffff;
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.4px;
}

.card-header p {
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.85rem;
  margin: 0.3rem 0 0;
}

.card-body {
  padding: 1.8rem 1.8rem 1.6rem;
}

.alert-success {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #eafbee;
  color: var(--green);
  border: 1.5px solid var(--green);
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 0.92rem;
  font-weight: 500;
  margin-bottom: 1.2rem;
}

.alert-error {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff0f0;
  color: var(--red);
  border: 1.5px solid var(--red);
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 0.92rem;
  font-weight: 500;
  margin-bottom: 1.2rem;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.file-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  border: 2px dashed #e0c840;
  border-radius: 14px;
  background: #fffbef;
  padding: 1.3rem 1rem;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.25s, background 0.25s, transform 0.2s;
}

.file-wrap:hover {
  border-color: var(--orange);
  background: #fff5e0;
  transform: scale(1.01);
}

.file-wrap input[type="file"] {
  display: none;
}

.file-wrap i {
  font-size: 26px;
  color: var(--gold);
}

.file-wrap span {
  font-size: 0.88rem;
  color: #999;
  font-weight: 500;
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.input-wrap input {
  width: 100%;
  padding: 0.9rem 1rem 0.9rem 2.8rem;
  font-size: 1rem;
  font-family: inherit;
  border: 1.5px solid #e8e0d0;
  border-radius: 12px;
  background: var(--cream);
  color: #1a1a1a;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}

.input-wrap input:hover {
  border-color: #d4b800;
  background: #fffef5;
}

.input-wrap input:focus {
  border-color: var(--gold);
  background: #ffffff;
  box-shadow: 0 0 0 3.5px rgba(244, 180, 0, 0.18);
}

.input-wrap input::placeholder {
  color: #bbb;
}

.icon-left {
  position: absolute;
  left: 14px;
  font-size: 18px;
  color: #ccc;
  pointer-events: none;
  transition: color 0.2s;
  z-index: 1;
}

.input-wrap input:hover ~ .icon-left,
.input-wrap input:focus ~ .icon-left {
  color: var(--gold);
}

.btn {
  width: 100%;
  min-height: 52px;
  padding: 1rem;
  background: linear-gradient(
    to bottom right,
    #FFD54F,
    #FF9800,
    #FF3D00,
    #D50000
  );
  color: #ffffff;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.6px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-top: 0.3rem;
  transition: opacity 0.25s, transform 0.15s, box-shadow 0.25s;
}

.btn:hover {
  opacity: 0.88;
  box-shadow: 0 6px 20px rgba(214, 40, 40, 0.35);
  transform: translateY(-1px);
}

.btn:active {
  transform: scale(0.98);
  box-shadow: none;
}

.divider {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin: 1.1rem 0 0.7rem;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #f0e8d8;
}

.divider span {
  font-size: 0.78rem;
  color: #bbb;
  font-weight: 500;
  white-space: nowrap;
}

.links {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
}

.links a {
  font-size: 0.9rem;
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
  padding: 0.45rem 0.8rem;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.2s, color 0.2s, transform 0.15s;
}

.links a:hover {
  background: #edf7ef;
  color: #2a5c31;
  transform: translateY(-1px);
}

.links a i {
  font-size: 15px;
}

@media (max-width: 480px) {
  .page {
    align-items: flex-start;
    padding: 0;
  }

  .card {
    border-radius: 0 0 24px 24px;
    max-width: 100%;
    box-shadow: 0 8px 30px rgba(214, 40, 40, 0.12);
  }

  .card:hover {
    transform: none;
  }

  .card-body {
    padding: 1.5rem 1.2rem 1.8rem;
  }
}

</head>
